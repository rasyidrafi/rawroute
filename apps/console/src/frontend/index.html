<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A protocol-preserving multi-provider AI gateway" />
    <title>RawRoute</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <script>
      (() => {
        let theme = "system";
        try { theme = localStorage.getItem("theme") || "system"; } catch {}
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body class="flex min-h-full flex-col">
    <div id="root" class="flex min-h-svh flex-1 flex-col"></div>
    <noscript>Enable JavaScript to use the RawRoute dashboard.</noscript>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
