services:
  rawroute:
    image: ${RAWROUTE_IMAGE:-docker.io/rasyidrafi/rawroute:latest}
    environment:
      SQLITE_PATH: /data/rawroute.sqlite
      TIMEZONE: ${TIMEZONE:-UTC}
      RAWROUTE_PUBLIC_URL: ${RAWROUTE_PUBLIC_URL:-}
      RAWROUTE_ALLOWED_ORIGINS: ${RAWROUTE_ALLOWED_ORIGINS:-}
      CLIPROXY_MODE: external
      RAWROUTE_DATA_DIR: /data
      CLIPROXY_URL: http://cli-proxy-api:8317
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:?Set CLIPROXY_MANAGEMENT_KEY}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:?Set CLIPROXY_API_KEY}
      # Optional private Executor integration. The Executor service is profile
      # gated below, so existing deployments do not start it accidentally.
      EXECUTOR_UPSTREAM_URL: ${EXECUTOR_UPSTREAM_URL:-http://executor:4788}
      EXECUTOR_UPSTREAM_API_KEY: ${EXECUTOR_UPSTREAM_API_KEY:-}
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-unknown}
    depends_on:
      cli-proxy-api:
        condition: service_started
      # The Executor service is profile-gated. `required: false` keeps the
      # default RawRoute deployment independent from that optional profile.
      executor:
        condition: service_started
        required: false
    volumes:
      - rawroute-data:/data
    ports:
      - "${RAWROUTE_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 45s
    restart: unless-stopped

  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:v8.0.43@sha256:3f74ca56cba8bea2a2a096a215bb774482d87d257da04c5047e6046493bfd644}
    pull_policy: always
    environment:
      # This enables the internal Management API without publishing it.
      MANAGEMENT_PASSWORD: ${CLIPROXY_MANAGEMENT_KEY:?Set CLIPROXY_MANAGEMENT_KEY}
    expose:
      - "8317"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./cliproxy/config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./cliproxy/auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./cliproxy/logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./cliproxy/plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped

  # Start with `docker compose --profile executor up -d`. It has no host port;
  # RawRoute reaches it only through the Compose network.
  executor:
    profiles: ["executor"]
    image: ${EXECUTOR_IMAGE:-ghcr.io/usefulsoftwareco/executor-selfhost:latest}
    environment:
      PORT: 4788
      EXECUTOR_HOST: 0.0.0.0
      EXECUTOR_DATA_DIR: /data
      EXECUTOR_BOOTSTRAP_ADMIN_EMAIL: ${EXECUTOR_BOOTSTRAP_ADMIN_EMAIL:-}
      EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD: ${EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD:-}
      EXECUTOR_BOOTSTRAP_ADMIN_NAME: ${EXECUTOR_BOOTSTRAP_ADMIN_NAME:-Admin}
      EXECUTOR_ALLOW_LOCAL_NETWORK: ${EXECUTOR_ALLOW_LOCAL_NETWORK:-false}
      EXECUTOR_ALLOW_STDIO_MCP: ${EXECUTOR_ALLOW_STDIO_MCP:-false}
      EXECUTOR_WEB_BASE_URL: ${EXECUTOR_WEB_BASE_URL:-}
    expose:
      - "4788"
    volumes:
      - executor-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4788/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: unless-stopped

volumes:
  rawroute-data:
  executor-data:
