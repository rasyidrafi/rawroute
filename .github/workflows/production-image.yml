name: Production image

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # next build also checks TypeScript. The VM only pulls the finished image.
      - name: Build production image
        run: >-
          docker build --build-arg DEPLOYMENT_VERSION="$GITHUB_SHA"
          -t "rasyidrafi/rawroute:sha-$GITHUB_SHA"
          -t rasyidrafi/rawroute:latest .
      - name: Publish to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "rasyidrafi/rawroute:sha-$GITHUB_SHA"
          docker push rasyidrafi/rawroute:latest
